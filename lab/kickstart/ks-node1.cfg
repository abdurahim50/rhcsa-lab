#version=RHEL10
# =====================================================================
# RHCSA practice lab - node1.lab.example.com  (YOUR EXAM MACHINE)
#
# Deliberately minimal. Tools you will need for the exam objectives
# (semanage, nfs-utils, autofs, firewalld extras) are NOT pre-installed,
# because installing them from an offline repo is itself an exam skill.
#
# Boot the RHEL 10 ISO, press ESC/e at the boot menu and append:
#   inst.ks=http://172.25.250.1:8000/ks-node1.cfg
# =====================================================================

text
eula --agreed
reboot

keyboard --xlayouts='us'
lang en_US.UTF-8
timezone America/Chicago --utc

# --- Installation source: the DVD attached to the virtual CD/DVD drive
cdrom

# --- Disks -----------------------------------------------------------
# Assumes a VMware Paravirtual SCSI controller -> sda/sdb/sdc/sdd.
# Do NOT use LSI Logic SAS/Parallel: those drivers are gone from RHEL 8+
# and the installer will show no disks.
# If you used NVMe instead, substitute nvme0n1 for sda in the four lines
# below (ignoredisk, clearpart, the three --ondisk, and bootloader).
#
# Install ONLY to sda (20 GB). sdb/sdc/sdd stay raw and untouched so you
# can practise partitioning, PV/VG/LV creation, and swap from scratch.
ignoredisk --only-use=sda
zerombr
clearpart --all --initlabel --drives=sda

part /boot/efi --fstype=efi   --size=600  --ondisk=sda --fsoptions="umask=0077,shortname=winnt"
part /boot     --fstype=xfs   --size=1024 --ondisk=sda
part pv.01                    --size=1 --grow --ondisk=sda

volgroup vg_system pv.01
logvol /    --vgname=vg_system --name=lv_root --fstype=xfs  --size=10240
logvol swap --vgname=vg_system --name=lv_swap --fstype=swap --size=2048
# ~6 GB is intentionally LEFT FREE in vg_system so you can practise
# `lvextend -r` and `xfs_growfs` against a real, live root filesystem.

bootloader --boot-drive=sda --timeout=5

# --- Network ---------------------------------------------------------
# No gateway / no DNS server on purpose: this lab is offline, exactly
# like the exam. Name resolution comes from /etc/hosts (see %post).
# Kickstart has NO line continuation: every command must be on one line.
# A backslash here does not join lines, it makes the rest unknown commands
# and the machine comes up with no address.
network --bootproto=static --device=link --ip=172.25.250.10 --netmask=255.255.255.0 --hostname=node1.lab.example.com --activate --onboot=on

# --- Accounts --------------------------------------------------------
rootpw --plaintext redhat --allow-ssh
user --name=student --password=student --plaintext --gecos="Student User" --groups=wheel

# --- Security --------------------------------------------------------
selinux --enforcing
firewall --enabled --service=ssh
services --enabled="sshd,chronyd"
firstboot --disable

%packages
@^minimal-environment
vim-enhanced
bash-completion
man-pages
man-db
tar
bzip2
gzip
tree
lsof
psmisc
-subscription-manager-cockpit
%end

%post --log=/root/ks-post.log
# ---------------------------------------------------------------------
# Offline repo from the attached DVD. `nofail` means the box still boots
# if you ever detach the ISO.
# ---------------------------------------------------------------------
mkdir -p /mnt/dvd
echo '/dev/sr0  /mnt/dvd  iso9660  ro,nofail  0 0' >> /etc/fstab

cat > /etc/yum.repos.d/lab-dvd.repo <<'EOF'
[dvd-baseos]
name=RHEL 10 BaseOS (local DVD)
baseurl=file:///mnt/dvd/BaseOS
enabled=1
gpgcheck=1
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release

[dvd-appstream]
name=RHEL 10 AppStream (local DVD)
baseurl=file:///mnt/dvd/AppStream
enabled=1
gpgcheck=1
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release
EOF

# ---------------------------------------------------------------------
# Static name resolution for the lab network
# ---------------------------------------------------------------------
cat >> /etc/hosts <<'EOF'

# RHCSA practice lab
172.25.250.10   node1.lab.example.com   node1
172.25.250.11   node2.lab.example.com   node2
EOF

# Handy shell defaults (remove these if you want a 100%-bare exam feel)
cat > /etc/profile.d/lab.sh <<'EOF'
alias ll='ls -lh --color=auto'
export EDITOR=vi
EOF
%end
