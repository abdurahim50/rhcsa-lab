#version=RHEL10
# =====================================================================
# RHCSA practice lab - node2.lab.example.com  (SERVICES HOST)
#
# node2 plays the role of the "already configured infrastructure" that
# the real exam hands you: an NFS server, an HTTP package repository,
# a time source, and a second box for scp/ssh/rsync tasks.
#
# It also doubles as a second exam machine when a task says
# "do this on both systems".
#
# Boot the RHEL 10 ISO, press ESC/e at the boot menu and append:
#   inst.ks=http://172.25.250.1:8000/ks-node2.cfg
# =====================================================================

text
eula --agreed
reboot

keyboard --xlayouts='us'
lang en_US.UTF-8
timezone America/Chicago --utc

cdrom

# Assumes a VMware Paravirtual SCSI controller -> sda/sdb.
# Do NOT use LSI Logic SAS/Parallel (drivers removed in RHEL 8+).
# On NVMe, substitute nvme0n1 for sda below.
ignoredisk --only-use=sda
zerombr
clearpart --all --initlabel --drives=sda

part /boot/efi --fstype=efi   --size=600  --ondisk=sda --fsoptions="umask=0077,shortname=winnt"
part /boot     --fstype=xfs   --size=1024 --ondisk=sda
part pv.01                    --size=1 --grow --ondisk=sda

volgroup vg_system pv.01
logvol /    --vgname=vg_system --name=lv_root --fstype=xfs  --size=12288
logvol swap --vgname=vg_system --name=lv_swap --fstype=swap --size=2048

bootloader --boot-drive=sda --timeout=5

network --bootproto=static --device=link \
        --ip=172.25.250.11 --netmask=255.255.255.0 \
        --hostname=node2.lab.example.com --activate --onboot=on

rootpw --plaintext redhat --allow-ssh
user --name=student --password=student --plaintext --gecos="Student User" --groups=wheel

selinux --enforcing
firewall --enabled --service=ssh
services --enabled="sshd,chronyd"
firstboot --disable

%packages
@^minimal-environment
vim-enhanced
bash-completion
man-pages
man-db
tar
bzip2
gzip
tree
lsof
psmisc
httpd
nfs-utils
chrony
policycoreutils-python-utils
rsync
-subscription-manager-cockpit
%end

%post --log=/root/ks-post.log
mkdir -p /mnt/dvd
echo '/dev/sr0  /mnt/dvd  iso9660  ro,nofail  0 0' >> /etc/fstab

cat > /etc/yum.repos.d/lab-dvd.repo <<'EOF'
[dvd-baseos]
name=RHEL 10 BaseOS (local DVD)
baseurl=file:///mnt/dvd/BaseOS
enabled=1
gpgcheck=1
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release

[dvd-appstream]
name=RHEL 10 AppStream (local DVD)
baseurl=file:///mnt/dvd/AppStream
enabled=1
gpgcheck=1
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release
EOF

cat >> /etc/hosts <<'EOF'

# RHCSA practice lab
172.25.250.10   node1.lab.example.com   node1
172.25.250.11   node2.lab.example.com   node2
EOF

cat > /etc/profile.d/lab.sh <<'EOF'
alias ll='ls -lh --color=auto'
export EDITOR=vi
EOF
%end
