name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Syntax check
        run: |
          mapfile -t scripts < <(find . -name '*.sh' -type f -not -path './.git/*')
          printf 'Checking %d script(s)\n' "${#scripts[@]}"
          for s in "${scripts[@]}"; do bash -n "$s"; done

      - name: Shellcheck
        run: |
          mapfile -t scripts < <(find . -name '*.sh' -type f -not -path './.git/*')
          shellcheck --severity=warning "${scripts[@]}"

  graders:
    name: grader logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setfattr lets the test store real extended attributes, which is
      # the case that caught the original always-failing SELinux check.
      - name: Install attr
        run: sudo apt-get update && sudo apt-get install -y attr

      - name: Run grader helper tests
        run: ./tests/test-checks.sh

  kickstart:
    name: kickstart syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pykickstart
        run: pip install pykickstart

      # Kickstart has no line continuation, so a wrapped command silently
      # becomes garbage. ksvalidator catches that and much else.
      - name: Validate kickstart files
        run: |
          for ks in lab/kickstart/*.cfg; do
            echo "== $ks"
            ksvalidator -v RHEL9 "$ks"
          done

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check relative links
        run: ./tests/check-links.sh

  secrets:
    name: no real secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The kickstart files intentionally carry throwaway lab passwords
      # (root:redhat, student:student) for disposable VMs on an isolated
      # network. This check is here to catch anything that is NOT that:
      # private keys, tokens, and real credentials committed by accident.
      - name: Scan for private keys and tokens
        run: |
          if grep -rIn --exclude-dir=.git --exclude=lint.yml \
               -e 'BEGIN .*PRIVATE KEY' \
               -e 'ghp_[A-Za-z0-9]\{36\}' \
               -e 'AKIA[0-9A-Z]\{16\}' \
               -e 'xox[baprs]-' . ; then
            echo "::error::Possible real secret committed, see matches above"
            exit 1
          fi
          echo "No private keys or tokens found"
